<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#e62429"><link rel="manifest" href="manifest.webmanifest"><title>Spider AI</title>
<style>
*{box-sizing:border-box}body{margin:0;font:15px system-ui,sans-serif;background:linear-gradient(135deg,#1a0000,#000428);color:#fff;height:100dvh;display:flex;flex-direction:column;overflow:hidden}.header{padding:10px 12px;background:linear-gradient(90deg,#e62429,#8b1015);text-align:center}.header h1{margin:0;font-size:21px}.header select{width:100%;margin-top:7px;padding:8px;border:0;border-radius:8px;background:#381015;color:white}.tabs{display:flex;background:#09090dcc}.tab{flex:1;padding:10px 2px;text-align:center;font-size:12px;border-bottom:2px solid transparent}.tab.active{border-color:#f33;background:#e6242922}.panel{display:none;flex:1;min-height:0;overflow:auto;padding:12px;flex-direction:column;gap:9px}.panel.active{display:flex}#chat{flex:1;min-height:0;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px}.msg{max-width:90%;padding:11px 14px;border-radius:16px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}.user{align-self:flex-end;background:#d92530}.ai{align-self:flex-start;background:#ffffff16;border:1px solid #ffffff20}.msg img{max-width:100%;border-radius:9px}.composer{display:flex;gap:7px;padding:9px;background:#050912dd;align-items:center}.composer input{min-width:0;flex:1;padding:12px;border:2px solid #e62429;border-radius:24px;background:#ffffff0c;color:white;font:inherit}.btn{border:0;border-radius:12px;padding:11px;background:#292929;color:white;font-size:16px}.send,.primary{background:linear-gradient(135deg,#e62429,#0476f2);color:white}.primary{width:100%;padding:13px;border:0;border-radius:12px;font-weight:700;font-size:15px}.field{width:100%;padding:12px;border:1px solid #e62429;border-radius:10px;background:#ffffff0c;color:white;font:inherit}.hint{font-size:12px;opacity:.7;text-align:center}.result{text-align:center}.result img,.result video{max-width:100%;border-radius:12px}.chip{font-size:12px;color:#ffb3b3;padding:5px}.loader{padding:25px;text-align:center;font-size:30px}.slides{position:relative;aspect-ratio:16/9;overflow:hidden;border-radius:12px}.slides img{position:absolute;width:100%;height:100%;object-fit:cover;opacity:0;animation:fade 9s infinite}.slides img:nth-child(2){animation-delay:3s}.slides img:nth-child(3){animation-delay:6s}@keyframes fade{0%,100%{opacity:0}10%,33%{opacity:1}43%{opacity:0}}
</style>
</head>
<body>
<header class="header"><h1>🕷️ Spider AI</h1><select id="modelSel"><option value="openai">Загрузка моделей…</option></select></header>
<nav class="tabs"><div class="tab active" data-tab="chat">💬 Чат</div><div class="tab" data-tab="img">🖼️ Фото</div><div class="tab" data-tab="vid">🎬 Видео</div><div class="tab" data-tab="files">📎 Файлы</div></nav>
<section class="panel active" id="tab-chat" style="padding:0"><div id="chat"><div class="hint" style="margin:auto">🕸️ Привет! Чат, генерация изображений и анализ файлов.</div></div><div id="chipWrap" class="chip"></div><div class="composer"><button class="btn" id="attachBtn">📎</button><button class="btn" id="micBtn">🎤</button><input id="prompt" placeholder="Напиши сообщение…" autocomplete="off"><button class="btn send" id="sendBtn">➤</button></div></section>
<section class="panel" id="tab-img"><textarea class="field" id="imgPrompt" rows="4" placeholder="Опиши изображение…"></textarea><select class="field" id="imgModel"><option>flux</option><option>turbo</option><option>kontext</option></select><select class="field" id="imgSize"><option value="1024x1024">1024×1024</option><option value="1024x576">1024×576</option><option value="576x1024">576×1024</option></select><button class="primary" id="genImageBtn">🎨 Сгенерировать</button><div class="result" id="imgResult"></div></section>
<section class="panel" id="tab-vid"><textarea class="field" id="vidPrompt" rows="4" placeholder="Опиши короткий клип…"></textarea><button class="primary" id="genVideoBtn">🎬 Создать клип из кадров</button><div class="result" id="vidResult"></div><p class="hint">Это анимированное слайд-шоу из 3 изображений, не полноценная генерация видеофайла.</p></section>
<section class="panel" id="tab-files"><p>Поддерживаются изображения и текстовые файлы: TXT, MD, JSON, JS, HTML, CSS, PY, CSV, LOG, XML, YAML.</p><button class="primary" id="chooseFileBtn">📎 Выбрать файл</button><div id="fileInfo" class="hint"></div><textarea class="field" id="fileQuestion" rows="3" placeholder="Что нужно узнать из файла?"></textarea><button class="primary" id="sendFileBtn">Отправить на анализ</button></section>
<input id="fileInput" type="file" hidden accept="image/*,.txt,.md,.json,.js,.html,.css,.py,.csv,.log,.xml,.yml,.yaml">
<script>
const $=id=>document.getElementById(id);
const chat=$('chat'),prompt=$('prompt');let attached=null,history=[];
function tab(name){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===name));document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('active',x.id==='tab-'+name));}
document.querySelectorAll('.tab').forEach(x=>x.addEventListener('click',()=>tab(x.dataset.tab)));
function addMsg(role,text,image){const d=document.createElement('div');d.className='msg '+role;d.textContent=text||'';if(image){const im=document.createElement('img');im.src=image;d.appendChild(im)}chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d}
async function loadModels(){try{const r=await fetch('https://text.pollinations.ai/models');if(!r.ok)throw Error();const j=await r.json();const list=Array.isArray(j)?j.map(x=>typeof x==='string'?x:x.name||x.id).filter(Boolean):Object.keys(j);$('modelSel').innerHTML='';list.forEach(m=>{const o=document.createElement('option');o.value=m;o.textContent='🧠 '+m;$('modelSel').appendChild(o)});if(list.includes('openai'))$('modelSel').value='openai'}catch(e){$('modelSel').innerHTML='<option value="openai">openai</option><option value="mistral">mistral</option><option value="deepseek">deepseek</option><option value="qwen">qwen</option>'}}
loadModels();
async function askAI(text,imageData){const model=$('modelSel').value;const content=imageData?[{type:'text',text:text||'Опиши изображение'},{type:'image_url',image_url:{url:imageData}}]:text;const messages=[{role:'system',content:'Ты Spider AI, дружелюбный ИИ-помощник. Отвечай по-русски, точно и структурированно.'},{role:'user',content}];
const attempts=[
()=>fetch('https://text.pollinations.ai/',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model,messages})}),
()=>fetch('https://text.pollinations.ai/'+encodeURIComponent(text||'Опиши изображение'),{method:'GET'}),
()=>fetch('https://free.churchless.tech/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'gpt-4o-mini',messages})})
];
for(let i=0;i<attempts.length;i++){try{const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),45000);const response=await attempts[i]();clearTimeout(timer);if(!response.ok)continue;const body=await response.text();if(!body)continue;try{const j=JSON.parse(body);return j.choices?.[0]?.message?.content||j.response||body}catch{return body}}catch(e){}}
throw Error('Все доступные сейчас сервисы не ответили. Попробуй позже.')}
async function send(){const t=prompt.value.trim(),a=attached;if(!t&&!a)return;addMsg('user',(t||'')+(a?' ['+a.name+']':''),a?.type==='image'?a.data:null);prompt.value='';attached=null;$('chipWrap').textContent='';const d=addMsg('ai','🕷️ Думаю…');let q=t;if(a?.type==='text')q='Содержимое файла '+a.name+':\n'+a.content+'\n\nВопрос: '+(t||'Проанализируй файл и сделай обзор.');try{const ans=await askAI(q,a?.type==='image'?a.data:null);d.textContent=ans;history.push({q,a:ans})}catch(e){d.textContent='❌ '+e.message}}
$('sendBtn').onclick=send;prompt.addEventListener('keydown',e=>{if(e.key==='Enter')send()});
function speak(t){if(!('speechSynthesis'in window)){alert('Озвучка не поддерживается');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ru-RU';speechSynthesis.speak(u)}
$('micBtn').onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert('Голосовой ввод не поддерживается в этом WebView');return}const r=new SR();r.lang='ru-RU';r.onresult=e=>prompt.value=e.results[0][0].transcript;r.start()};
$('attachBtn').onclick=$('chooseFileBtn').onclick=()=>$('fileInput').click();
function compress(file){return new Promise((resolve,reject)=>{const url=URL.createObjectURL(file),im=new Image();im.onload=()=>{const scale=Math.min(1,1024/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*scale;c.height=im.height*scale;c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);resolve(c.toDataURL('image/jpeg',.82))};im.onerror=reject;im.src=url})}
$('fileInput').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(f.type.startsWith('image/')){if(f.size>6*1024*1024)throw Error('Изображение должно быть до 6 МБ');attached={type:'image',name:f.name,data:await compress(f)}}else{attached={type:'text',name:f.name,content:(await f.text()).slice(0,15000)}}$('fileInfo').textContent='Прикреплено: '+f.name;$('chipWrap').textContent='📎 '+f.name}catch(err){alert(err.message)}};
$('sendFileBtn').onclick=()=>{prompt.value=$('fileQuestion').value.trim();tab('chat');send()};
$('genImageBtn').onclick=()=>{const p=$('imgPrompt').value.trim();if(!p)return alert('Опиши картинку');const [w,h]=$('imgSize').value.split('x'),m=$('imgModel').value,url='https://image.pollinations.ai/prompt/'+encodeURIComponent(p)+'?model='+encodeURIComponent(m)+'&width='+w+'&height='+h+'&nologo=true&seed='+Math.floor(Math.random()*1e6),box=$('imgResult');box.innerHTML='<div class="loader">🕷️ Генерирую…</div>';const im=new Image();im.onload=()=>{box.innerHTML='';box.appendChild(im);const a=document.createElement('a');a.href=im.src;a.download='spider-ai-image.jpg';a.textContent='Скачать изображение';a.style='display:block;color:#fff;padding:12px';box.appendChild(a)};im.onerror=()=>box.textContent='Не удалось получить изображение. Попробуй позже.';im.src=url};
$('genVideoBtn').onclick=()=>{const p=$('vidPrompt').value.trim();if(!p)return alert('Опиши клип');const box=$('vidResult');box.innerHTML='<div class="loader">🎬 Загружаю кадры…</div>';const frames=[1,2,3].map(i=>'https://image.pollinations.ai/prompt/'+encodeURIComponent('Cinematic film frame '+i+' of 3, consistent scene: '+p)+'?model=flux&width=960&height=540&nologo=true&seed='+Math.floor(Math.random()*1e6));box.innerHTML='';const s=document.createElement('div');s.className='slides';frames.forEach((url,i)=>{const im=new Image();im.src=url;im.alt='Кадр '+(i+1);s.appendChild(im)});box.appendChild(s)};
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
