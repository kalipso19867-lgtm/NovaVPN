<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#e62429">
<link rel="manifest" href="manifest.webmanifest">
<title>Spider AI</title>
<style>
:root{color-scheme:dark;--bg:#212121;--panel:#2f2f2f;--panel2:#383838;--line:#454545;--text:#ececec;--muted:#a5a5a5;--accent:#10a37f;--accent2:#19c79a;--radius:18px;--safe:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;height:100dvh;overflow:hidden}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select{font:inherit;color:inherit}
button{border:0;cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.38;cursor:not-allowed}
header{height:58px;flex:none;display:flex;align-items:center;gap:9px;padding:0 12px;background:var(--bg);border-bottom:1px solid #ffffff0d}
.brand{display:flex;align-items:center;gap:9px;flex:1;min-width:0}
.logo{width:34px;height:34px;border-radius:11px;background:linear-gradient(145deg,#19c79a,#087b63);display:grid;place-items:center;font-size:19px}
header h1{font-size:16px;font-weight:650;margin:0;letter-spacing:.1px}
.header-actions{display:flex;gap:5px}
.icon-btn{width:40px;height:40px;border-radius:13px;background:transparent;color:#d6d6d6;display:grid;place-items:center;font-size:18px}
.icon-btn:active,.tool-btn:active,.send-btn:active{transform:scale(.96);background:#ffffff18}
.icon-btn:hover,.tool-btn:hover{background:#ffffff12}
#modelSel{max-width:125px;min-width:0;height:36px;border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:0 8px;font-size:11px;color:#ddd}
#chat{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;padding:20px 14px 24px;display:flex;flex-direction:column;gap:15px;scroll-behavior:smooth}
.welcome{width:min(100%,720px);margin:auto;padding:25px 8px;text-align:center}
.welcome-logo{width:62px;height:62px;border-radius:21px;margin:0 auto 18px;background:linear-gradient(145deg,#19c79a,#087b63);display:grid;place-items:center;font-size:32px;box-shadow:0 8px 35px #10a37f30}
.welcome h2{font-size:clamp(24px,6vw,32px);font-weight:650;line-height:1.2;margin:0 0 10px}
.welcome p{margin:0;color:var(--muted);font-size:14px}
.suggestions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:25px auto 0;max-width:620px;text-align:left}
.suggestion{min-height:70px;padding:12px 14px;border:1px solid var(--line);border-radius:15px;background:#ffffff06;color:#ddd;text-align:left;font-size:13px}
.suggestion b{display:block;color:#f0f0f0;font-size:13px;margin-bottom:3px}
.suggestion span{color:var(--muted);font-size:11px}
.msg{width:fit-content;max-width:min(92%,760px);padding:11px 15px;border-radius:18px;line-height:1.6;overflow-wrap:anywhere;background:var(--panel2);border:1px solid #ffffff08}
.user{align-self:flex-end;background:#0b6e59;border-color:#13866e;color:#fff;border-bottom-right-radius:6px}
.ai{align-self:flex-start;background:transparent;border-color:transparent;padding:7px 3px;max-width:min(96%,780px);border-bottom-left-radius:6px}
.msg img,.msg video{display:block;max-width:100%;max-height:420px;border-radius:12px;margin-top:8px}
.msg pre{white-space:pre-wrap;overflow:auto;background:#161616;padding:10px;border-radius:9px}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.actions button{padding:7px 10px;border-radius:10px;background:#ffffff0b;color:#bdbdbd;font-size:12px;border:1px solid #ffffff12}
.actions button:active{background:#ffffff20}
#modelStatus{flex:none;padding:4px 12px;color:#929292;text-align:center;font-size:11px;min-height:22px}
#chiprow{display:flex;gap:7px;overflow-x:auto;padding:2px 12px;white-space:nowrap;flex:none}
.chip{display:inline-flex;align-items:center;gap:7px;padding:6px 9px;border-radius:10px;background:#ffffff0c;border:1px solid var(--line);font-size:12px;color:#ddd}
.chip button{background:transparent;color:#aaa;padding:0 3px}
.tools{flex:none;display:flex;gap:7px;overflow-x:auto;padding:8px 12px 3px;scrollbar-width:none}
.tools::-webkit-scrollbar{display:none}
.tool-btn{white-space:nowrap;display:flex;align-items:center;gap:7px;padding:8px 12px;min-height:38px;border:1px solid var(--line);border-radius:12px;background:transparent;color:#c6c6c6;font-size:12px}
.tool-btn.active{background:#10a37f20;border-color:#10a37f80;color:#6fe0bd}
.tool-btn .tool-icon{font-size:15px}
.tool-btn.soon{opacity:.42}
.composer-wrap{flex:none;padding:8px 12px calc(10px + var(--safe));background:linear-gradient(180deg,transparent,var(--bg) 20%)}
.composer{width:min(100%,820px);margin:0 auto;display:flex;align-items:flex-end;gap:8px;padding:8px;border-radius:24px;background:var(--panel);border:1px solid #555;box-shadow:0 5px 25px #0002}
.composer:focus-within{border-color:#777;box-shadow:0 0 0 1px #777}
#prompt{flex:1;min-width:0;max-height:150px;min-height:42px;resize:none;border:0;outline:0;background:transparent;color:var(--text);padding:10px 5px;font:15px/1.45 inherit}
#prompt::placeholder{color:#999}
.send-btn{width:42px;height:42px;flex:none;border-radius:15px;background:var(--accent);color:white;font-size:19px;display:grid;place-items:center}
.send-btn:disabled{background:#555;opacity:1}
.composer-hint{text-align:center;color:#858585;font-size:10px;padding-top:7px}
.progress{margin-top:4px;min-width:min(260px,70vw)}.progress-label{display:flex;justify-content:space-between;gap:12px;font-size:12px;margin-bottom:5px}.track{height:7px;border-radius:8px;background:#ffffff20;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,#10a37f,#45d6ae);transition:width .2s}
#fileInput{position:fixed;left:-10000px;width:1px;height:1px;opacity:0}
a{color:#73d9bd}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #5bd9b0;outline-offset:2px}
@media(max-width:420px){header{padding:0 8px;gap:5px}#modelSel{max-width:98px;font-size:10px}.icon-btn{width:36px}.suggestions{gap:7px}.suggestion{padding:10px;min-height:66px}.tool-btn{padding:7px 10px}.composer-wrap{padding-left:8px;padding-right:8px}}
@media(min-width:700px){#chat{padding:28px 24px}.composer-wrap{padding-left:24px;padding-right:24px}.welcome{padding:35px 10px}}
</style>
</head>
<body>
<header>
 <div class="brand"><div class="logo">🕷</div><h1>Spider AI</h1></div>
 <select id="modelSel" aria-label="Локальная модель"><option>Qwen2.5 0.5B · локально</option></select>
 <div class="header-actions"><button class="icon-btn" id="settings" title="Состояние и настройки" aria-label="Настройки">⚙</button><button class="icon-btn" id="clear" title="Новый чат" aria-label="Новый чат">＋</button></div>
</header>
<main id="chat">
 <section class="welcome" id="welcome">
  <div class="welcome-logo">🕷</div><h2>Чем займёмся?</h2><p>Локальный ИИ-помощник. Работает на устройстве, без API-ключей.</p>
  <div class="suggestions">
   <button class="suggestion" data-prompt="Объясни сложную тему простыми словами"><b>📚 Объяснить тему</b><span>Понятно и по шагам</span></button>
   <button class="suggestion" data-prompt="Помоги написать и проверить код"><b>💻 Помочь с кодом</b><span>Разработка и отладка</span></button>
   <button class="suggestion" data-prompt="Составь подробный план решения моей задачи"><b>🧭 Составить план</b><span>Разбить задачу на этапы</span></button>
   <button class="suggestion" data-prompt="Придумай несколько необычных идей проекта"><b>💡 Придумать идеи</b><span>Идеи и варианты</span></button>
  </div>
 </section>
</main>
<div id="modelStatus">Проверяю локальную модель…</div>
<div id="chiprow"></div>
<nav class="tools" aria-label="Инструменты">
 <button class="tool-btn active" data-mode="chat"><span class="tool-icon">✳</span>Чат</button>
 <button class="tool-btn" id="attach"><span class="tool-icon">📂</span>Добавить файлы</button>
 <button class="tool-btn" data-mode="img"><span class="tool-icon">▧</span>Создать фото</button>
 <button class="tool-btn" data-mode="clip"><span class="tool-icon">▷</span>Создать видео</button>
 <button class="tool-btn" data-mode="edit"><span class="tool-icon">✧</span>Изменить медиа</button>
</nav>
<div class="composer-wrap">
 <div class="composer"><button class="icon-btn" id="mic" title="Голосовой ввод" aria-label="Голосовой ввод">🎙</button><textarea id="prompt" rows="1" placeholder="Спроси что-нибудь…" autocomplete="off"></textarea><button class="send-btn" id="send" aria-label="Отправить">↑</button></div>
 <div class="composer-hint">Spider AI может ошибаться. Проверяй важную информацию.</div>
</div>
<input id="fileInput" type="file" multiple accept="image/*,video/*,audio/*,.txt,.md,.json,.js,.ts,.py,.html,.css,.csv,.log,.xml,.yml,.yaml,.java,.sql">
<script>
const $=id=>document.getElementById(id), chat=$('chat'), input=$('prompt'), fileInput=$('fileInput');
const SYSTEM='Ты — Spider AI, универсальный ИИ-помощник. Отвечай на русском, понятно, структурированно и по делу.';
const FALLBACK_MODELS=['openai/gpt-oss-20b','mistralai/mistral-small-3.2','qwen/qwen3-coder-30b-a3b-instruct','meta/llama-3.3-70b-instruct'];
let mode='chat', attachments=[], history=[], modelList=FALLBACK_MODELS.slice(), imageModels=[], videoModels=[], pollenKey='';
try{pollenKey=localStorage.getItem('sp_pollinations_key')||''}catch(e){}
try{history=JSON.parse(localStorage.getItem('sp_h')||'[]')}catch(e){}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function save(){try{localStorage.setItem('sp_h',JSON.stringify(history.slice(-80)))}catch(e){}}
function addMessage(role,text,html,saveIt=true){
 const d=document.createElement('div');d.className='msg '+role;
 const body=document.createElement('div');body.innerHTML=html||esc(text).replace(/\n/g,'<br>');d.append(body);
 if(role==='ai'){
  const bar=document.createElement('div');bar.className='actions';
  const cp=document.createElement('button');cp.textContent='📋 Копировать';cp.onclick=()=>copyText(text,cp);bar.append(cp);
  const sp=document.createElement('button');sp.textContent='🔊 Озвучить';sp.onclick=()=>speak(text);bar.append(sp);
  const media=body.querySelector('img,video');
  if(media){const dl=document.createElement('button');dl.textContent='💾 Скачать';dl.onclick=()=>download(media.src,media.tagName==='VIDEO'?'spider-video.webm':'spider-image.jpg');bar.append(dl)}
  d.append(bar);
 }
 chat.append(d);chat.scrollTop=chat.scrollHeight;
 if(saveIt){history.push({r:role,t:text});history=history.slice(-80);save()}
 return d;
}
function copyText(t,b){const fallback=()=>{const x=document.createElement('textarea');x.value=t;document.body.append(x);x.select();document.execCommand('copy');x.remove()};(navigator.clipboard?.writeText(t)||Promise.reject()).then(()=>{}).catch(fallback);b.textContent='✅ Скопировано';setTimeout(()=>b.textContent='📋 Копировать',1400)}
function speak(t){if(!('speechSynthesis'in window))return; speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/[`*_#]/g,''));u.lang='ru-RU';speechSynthesis.speak(u)}
function download(url,name){const a=document.createElement('a');a.href=url;a.download=name;a.click()}
function progress(label){const d=document.createElement('div');d.className='msg ai';d.innerHTML='<div class="progress"><div class="progress-label"><span></span><b>0%</b></div><div class="track"><div class="fill"></div></div></div>';chat.append(d);chat.scrollTop=chat.scrollHeight;const l=d.querySelector('span'),p=d.querySelector('b'),f=d.querySelector('.fill');return{el:d,set(n,s){n=Math.max(0,Math.min(99,Math.round(n)));f.style.width=n+'%';p.textContent=n+'%';l.textContent=s||label;chat.scrollTop=chat.scrollHeight},done(){d.remove()}}}
function timerProgress(pb){let n=2;const id=setInterval(()=>{n=Math.min(90,n+1+Math.random()*3);pb.set(n,'🕷️ Получаю ответ…')},650);return()=>clearInterval(id)}
async function catalog(path){try{const r=await fetch('https://gen.pollinations.ai'+path);if(!r.ok)throw Error('HTTP '+r.status);const j=await r.json();return Array.isArray(j)?j:(j.data||j.models||[])}catch(e){console.warn('catalog',path,e);return[]}}
function modelId(x){return x.id||x.name||x.model||''}
function supports(x,term){return JSON.stringify(x.supported_endpoints||x.endpoints||[]).toLowerCase().includes(term)||JSON.stringify(x.capabilities||[]).toLowerCase().includes(term)}
async function loadModels(){
 const [texts,imgs,vids]=await Promise.all([catalog('/text/models'),catalog('/image/models'),catalog('/video/models')]);
 const usable=texts.filter(x=>modelId(x)).map(modelId);
 if(usable.length)modelList=usable;
 imageModels=imgs.filter(x=>modelId(x)).map(modelId);
 videoModels=vids.filter(x=>modelId(x)).map(modelId);
 const sel=$('modelSel');sel.innerHTML='';
 modelList.forEach(m=>{const o=document.createElement('option');o.value=m;o.textContent=m;sel.append(o)});
 const saved=localStorage.getItem('sp_model');if(saved&&modelList.includes(saved))sel.value=saved;
 const status=$('modelStatus');if(status)status.textContent='Каталог обновлён: '+modelList.length+' текстовых · '+imageModels.length+' фото · '+videoModels.length+' видео моделей';
}
$('modelSel').onchange=()=>localStorage.setItem('sp_model',$('modelSel').value);
async function connectPollinations(){
 try{
  const init=await fetch('https://enter.pollinations.ai/api/device/code',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({})});
  if(!init.ok)throw Error('Не удалось начать авторизацию: HTTP '+init.status);
  const d=await init.json();
  const approved=confirm('Подключение Pollinations. Открой страницу авторизации и подтверди доступ.\n\n'+d.verification_uri_complete+'\n\nКод: '+d.user_code+'\n\nПродолжить ожидание после открытия страницы?');
  if(!approved)return;
  window.open(d.verification_uri_complete,'_blank');
  const until=Date.now()+Math.min(1800,d.expires_in||1800)*1000;
  while(Date.now()<until){
   await new Promise(r=>setTimeout(r,Math.max(5,d.interval||5)*1000));
   const token=await fetch('https://enter.pollinations.ai/api/device/token',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({device_code:d.device_code})});
   const j=await token.json();
   if(token.ok&&j.access_token){pollenKey=j.access_token;alert('Pollinations подключён. Ключ хранится только в памяти приложения до его закрытия.');return}
   if(j.error==='authorization_pending'||j.error==='slow_down')continue;
   throw Error(j.error_description||j.error||'Ошибка авторизации');
  }
  throw Error('Код авторизации истёк. Нажми ⚙ и попробуй снова.');
 }catch(e){alert('Не удалось подключить Pollinations: '+e.message)}
}
function configurePollinationsKey(){const entered=prompt('Вставь свой Pollinations API key (sk_…). Он сохранится только в локальном хранилище этого приложения на телефоне. Не отправляй его в чат и не публикуй в GitHub.',pollenKey||'');if(entered===null)return;if(!entered.trim()){pollenKey='';try{localStorage.removeItem('sp_pollinations_key')}catch(e){}alert('Ключ удалён с этого устройства.');return}const key=entered.trim();if(!/^sk_[A-Za-z0-9_-]{12,}$/.test(key)){alert('Формат ключа не похож на Pollinations sk_-ключ.');return}pollenKey=key;try{localStorage.setItem('sp_pollinations_key',key);alert('Ключ сохранён только на этом устройстве. Теперь попробуй создать фото или видео.')}catch(e){alert('Не удалось сохранить ключ: '+e.message)}}
$('settings').onclick=()=>{const action=confirm('Spider AI · Настройки\n\nЛокальный чат: '+(window.SpiderLocal?window.SpiderLocal.status():'недоступен')+'\nPollinations: '+(pollenKey?'ключ сохранён на устройстве':'ключ не добавлен')+'\n\nOK — добавить/заменить ключ. Отмена — удалить сохранённый ключ.');if(action)configurePollinationsKey();else if(pollenKey&&confirm('Удалить сохранённый Pollinations ключ с этого устройства?'))configurePollinationsKeyClear()};
function configurePollinationsKeyClear(){pollenKey='';try{localStorage.removeItem('sp_pollinations_key')}catch(e){}alert('Ключ удалён с этого устройства.')}
function authHeaders(json=false){const h={};if(json)h['Content-Type']='application/json';if(pollenKey)h.Authorization='Bearer '+pollenKey;return h}
async function ask(text,images=[]){
 if(!window.SpiderLocal)throw Error('Локальный движок недоступен. Установи Android APK, а не открывай веб-версию.');
 if(images.length)text+='\\n\\nПримечание: в этой версии локальная модель обрабатывает текст. Вложения пока не передаются в модель.';
 const id='sp-'+Date.now()+'-'+Math.random().toString(36).slice(2);
 return new Promise((resolve,reject)=>{
  const timeout=setTimeout(()=>{delete window.__spWaiters[id];reject(Error('Локальная модель не ответила за 3 минуты'))},180000);
  window.__spWaiters=window.__spWaiters||{};
  window.__spWaiters[id]={resolve:v=>{clearTimeout(timeout);resolve(v)},reject:e=>{clearTimeout(timeout);reject(e)}};
  window.SpiderLocal.chat(id,text);
 });
}
window.onSpiderLocalResult=(id,answer,error)=>{
 const w=window.__spWaiters&&window.__spWaiters[id];if(!w)return;delete window.__spWaiters[id];
 if(error)w.reject(Error(error));else w.resolve(answer);
};
window.onSpiderLocalStatus=(status)=>{const el=$('modelStatus');if(el)el.textContent=status;};

function renderChips(){const w=$('chiprow');w.innerHTML='';attachments.forEach((a,i)=>{const c=document.createElement('span');c.className='chip';c.textContent=(a.type==='image'?'📷 ':a.type==='video'?'🎬 ':a.type==='audio'?'🎵 ':'📄 ')+a.name+' ';const b=document.createElement('button');b.textContent='✖';b.onclick=()=>{attachments.splice(i,1);renderChips()};c.append(b);w.append(c)})}
function readFile(f){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(f)})}
async function compressImage(file){const data=await readFile(file);return new Promise(resolve=>{const im=new Image();im.onload=()=>{const scale=Math.min(1,1000/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*scale);c.height=Math.round(im.height*scale);c.getContext('2d').drawImage(im,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.82))};im.onerror=()=>resolve(null);im.src=data})}
async function extractFrames(file,count=4){const u=URL.createObjectURL(file),v=document.createElement('video');v.preload='auto';v.muted=true;v.playsInline=true;return new Promise(resolve=>{v.onerror=()=>{URL.revokeObjectURL(u);resolve([])};v.onloadedmetadata=async()=>{const w=Math.min(640,v.videoWidth||640),h=Math.max(1,Math.round((v.videoHeight||360)*w/(v.videoWidth||640))),c=document.createElement('canvas'),ctx=c.getContext('2d');c.width=w;c.height=h;const out=[];for(let i=0;i<count;i++){const t=Math.min(v.duration*(i+.5)/count,Math.max(0,v.duration-.06));await new Promise(ok=>{let settled=false;const finish=()=>{if(settled)return;settled=true;try{ctx.drawImage(v,0,0,w,h);out.push(c.toDataURL('image/jpeg',.76))}catch(e){}ok()};v.addEventListener('seeked',finish,{once:true});v.currentTime=t;setTimeout(finish,4500)})}URL.revokeObjectURL(u);resolve(out)};v.src=u;v.load()})}
fileInput.onchange=async()=>{for(const f of [...fileInput.files]){if(f.type.startsWith('audio/')){if(f.size>25*1024*1024){alert('Аудиофайл должен быть до 25 МБ');continue}attachments.push({type:'audio',url:URL.createObjectURL(f),name:f.name,size:f.size,mime:f.type})}else if(f.type.startsWith('image/')){if(f.size>12*1024*1024){alert('Фото должно быть до 12 МБ');continue}const data=await compressImage(f);if(data)attachments.push({type:'image',data,name:f.name})}else if(f.type.startsWith('video/')){const frames=await extractFrames(f,4);if(frames.length)attachments.push({type:'video',frames,name:f.name})}else{try{attachments.push({type:'text',content:(await f.text()).slice(0,20000),name:f.name})}catch(e){}}}fileInput.value='';renderChips()};
$('attach').onclick=()=>fileInput.click();document.querySelectorAll('.tool-btn[data-mode]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tool-btn[data-mode]').forEach(x=>x.classList.toggle('active',x===b));mode=b.dataset.mode;input.placeholder=mode==='img'?'Опиши изображение, которое нужно создать…':mode==='clip'?'Опиши видео, которое нужно создать…':mode==='edit'?'Прикрепи фото/видео и опиши изменения…':'Спроси что-нибудь…';input.focus()});
async function editImage(prompt,items){
 if(!items.length){addMessage('ai','Прикрепи изображение и напиши, что изменить.',null,false);return}
 if(!pollenKey){addMessage('ai','Для редактирования нужен Pollinations sk_-ключ. Добавь его через ⚙.',null,false);return}
 const pb=progress('Редактирую изображение');
 try{
  const model=imageModels[0];if(!model)throw Error('Нет image-моделей в каталоге');
  const blob=await (await fetch(items[0].data)).blob(),form=new FormData();
  form.append('model',model);form.append('prompt',prompt||'Improve this image while preserving the subject');form.append('image',blob,'source.jpg');
  const r=await fetch('https://gen.pollinations.ai/v1/images/edits',{method:'POST',headers:authHeaders(),body:form});
  if(!r.ok)throw Error('Image edit API HTTP '+r.status);
  const j=await r.json(),item=j.data?.[0];let src=item?.url;
  if(!src&&item?.b64_json)src='data:image/png;base64,'+item.b64_json;
  if(!src)throw Error('Модель не вернула готовое изображение');
  pb.done();addMessage('ai','Изображение отредактировано ('+model+').','<img src="'+src+'" alt="Отредактированное фото">',false);
 }catch(e){pb.done();addMessage('ai','Не удалось отредактировать фото: '+e.message,null,false)}
}
function imageURL(prompt,w=1024,h=1024){return 'https://gen.pollinations.ai/image/'+encodeURIComponent(prompt)+'?model=' + encodeURIComponent(imageModels[0]||'black-forest-labs/flux.1-schnell')+'&width='+w+'&height='+h+'&seed='+Math.floor(Math.random()*1e6)}
async function fetchImage(url,pb,base,span,label){if(!pollenKey)throw Error('Для генерации нужен личный Pollinations sk_-ключ: ⚙ Настройки');const r=await fetch(url,{headers:authHeaders()});if(!r.ok)throw Error('HTTP '+r.status);const total=+r.headers.get('content-length')||0,reader=r.body.getReader(),chunks=[];let got=0;while(true){const x=await reader.read();if(x.done)break;chunks.push(x.value);got+=x.value.length;pb.set(total?base+span*got/total:Math.min(base+span-2,base+span*got/60000),label)}const all=new Uint8Array(got);let off=0;chunks.forEach(c=>{all.set(c,off);off+=c.length});return URL.createObjectURL(new Blob([all],{type:r.headers.get('content-type')||'image/jpeg'}))}
async function generateImage(prompt){if(!prompt)return;addMessage('user','🖼️ '+prompt);const pb=progress('Генерирую изображение');try{let w=1024,h=1024;if(/вертикал|портрет|9:16/i.test(prompt)){w=832;h=1216}else if(/горизонт|широк|16:9/i.test(prompt)){w=1216;h=832}const url=await fetchImage(imageURL(prompt,w,h),pb,0,96,'🖼️ Генерирую и загружаю…');pb.done('Фото готово');const html='<img src="'+url+'" alt="Созданное изображение">';addMessage('ai','Изображение готово: '+prompt,html,false)}catch(e){pb.done('Ошибка');addMessage('ai','Не удалось создать фото: '+e.message,null,false)}}
function loadImg(url){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(Error('Не удалось загрузить кадр'));i.src=url})}
const VW=1280,VH=720,FRAME_SECONDS=2.5,FADE=.55;
function drawCover(ctx,img,progress,reverse){const scale=Math.max(VW/img.width,VH/img.height)*(reverse?1.12-.12*progress:1+.12*progress),w=img.width*scale,h=img.height*scale,pan=(progress-.5)*36*(reverse?-1:1);ctx.drawImage(img,(VW-w)/2+pan,(VH-h)/2,w,h)}
async function buildWebM(images,pb){if(!window.MediaRecorder||!HTMLCanvasElement.prototype.captureStream)throw Error('Запись видео WebM не поддерживается этим браузером');const c=document.createElement('canvas');c.width=VW;c.height=VH;const ctx=c.getContext('2d'),stream=c.captureStream(30),mime=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'].find(x=>MediaRecorder.isTypeSupported(x));const rec=new MediaRecorder(stream,mime?{mimeType:mime,videoBitsPerSecond:2500000}:{}),chunks=[];rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};const stopped=new Promise((resolve,reject)=>{rec.onstop=resolve;rec.onerror=()=>reject(Error('Ошибка записи видео'))});rec.start();const total=images.length*FRAME_SECONDS,start=performance.now();await new Promise(resolve=>{function frame(now){const elapsed=Math.min(total,(now-start)/1000),idx=Math.min(images.length-1,Math.floor(elapsed/FRAME_SECONDS)),local=elapsed-idx*FRAME_SECONDS;ctx.fillStyle='#000';ctx.fillRect(0,0,VW,VH);drawCover(ctx,images[idx],local/FRAME_SECONDS,idx%2===1);if(local>FRAME_SECONDS-FADE&&idx<images.length-1){const p=(local-(FRAME_SECONDS-FADE))/FADE;ctx.globalAlpha=p;drawCover(ctx,images[idx+1],p,idx%2===0);ctx.globalAlpha=1}pb.set(80+19*elapsed/total,'🎞️ Собираю видеофайл…');if(elapsed>=total)resolve();else requestAnimationFrame(frame)}requestAnimationFrame(frame)});rec.stop();stream.getTracks().forEach(t=>t.stop());await stopped;return URL.createObjectURL(new Blob(chunks,{type:rec.mimeType||'video/webm'}))}
async function generateClip(prompt){
 if(!prompt)return;addMessage('user','🎬 '+prompt);
 if(!pollenKey){addMessage('ai','Для настоящей AI-генерации видео требуется авторизация Pollinations через ⚙. Бесплатные модели и платные модели показываются отдельно в каталоге.',null,false);return}
 if(!videoModels.length){addMessage('ai','В живом каталоге сейчас нет доступной видеомодели.',null,false);return}
 const pb=progress('Генерирую AI-видео');
 try{
  const model=videoModels[0],url='https://gen.pollinations.ai/video/'+encodeURIComponent(prompt)+'?model='+encodeURIComponent(model)+'&duration=5';
  const r=await fetch(url,{headers:authHeaders()});if(!r.ok)throw Error('Видео API HTTP '+r.status);
  const blob=await r.blob();if(!blob.type.startsWith('video/'))throw Error('Сервис вернул '+(blob.type||'неизвестный формат')+', а не видео');
  const src=URL.createObjectURL(blob);pb.done();
  addMessage('ai','Готово: AI-видео ('+model+').','<video controls playsinline src="'+src+'"></video><div class="small">MP4 · модель из актуального каталога</div>',false);
 }catch(e){pb.done();addMessage('ai','Не удалось создать видео: '+e.message,null,false)}
}
async function videoFromPhotos(items){if(!items.length)return;const pb=progress('Передаю фото видеомодели');try{if(!pollenKey)throw Error('Нужен личный Pollinations sk_-ключ в ⚙');const model=videoModels.find(x=>/wan|veo|seedance|ltx|kling|video/i.test(x));if(!model)throw Error('Нет доступной видеомодели с поддержкой каталога');const content=[{type:'text',text:'Create a short video using the attached image as the first frame. Preserve the main subject. Add natural motion. '+(input.value||'')}];content.push({type:'image_url',image_url:{url:items[0].data}});const r=await fetch('https://gen.pollinations.ai/v1/chat/completions',{method:'POST',headers:authHeaders(true),body:JSON.stringify({model,messages:[{role:'user',content}]})});if(!r.ok)throw Error('Video model HTTP '+r.status);const j=await r.json(),txt=j.choices?.[0]?.message?.content||'';const match=txt.match(/https?:\/\/[^\s)]+/i);if(match){pb.done();addMessage('ai','Видео готово: '+model,'<video controls playsinline src="'+esc(match[0])+'"></video>',false)}else{pb.done();addMessage('ai',txt||'Модель не вернула ссылку на видео.',null,false)}}catch(e){pb.done();addMessage('ai','Не удалось сделать видео из фото: '+e.message,null,false)}}
async function send(){const text=input.value.trim(),files=attachments.slice();if(!text&&!files.length)return;input.value='';attachments=[];renderChips();const command=text.match(/^\/(img|image|фото|clip|video|видео|vid|edit|правка)\s*(.*)$/i);if(mode==='edit'||command&&/^(edit|правка)$/i.test(command[1]))return editImage(command?command[2]:text,files.filter(x=>x.type==='image'));if(mode==='img'||command&&/^(img|image|фото)$/i.test(command[1]))return generateImage(command?command[2]:text);if(mode==='clip'||command&&/^(clip|video|видео)$/i.test(command[1]))return generateClip(command?command[2]:text);if(command&&command[1].toLowerCase()==='vid'){const photos=files.filter(x=>x.type==='image');if(photos.length)return videoFromPhotos(photos);if(text.length>4)return generateClip(text.slice(4));addMessage('ai','Прикрепи фото и отправь /vid.',null,false);return}
const imgs=files.filter(x=>x.type==='image').map(x=>x.data);const vids=files.filter(x=>x.type==='video');let prompt=text||'Проанализируй вложения и опиши их';files.filter(x=>x.type==='text').forEach(x=>prompt+='\n\nФайл '+x.name+':\n'+x.content);vids.forEach(v=>prompt+='\nВидео '+v.name+': ключевые кадры подготовлены, но локальная текстовая модель пока не умеет визуально анализировать их.');files.filter(x=>x.type==='audio').forEach(a=>prompt+='\nАудиофайл '+a.name+': файл прикреплён ('+a.mime+', '+Math.round(a.size/1024)+' КБ), но аудиомодель ещё не подключена — содержимое не распознано.');if(vids.length)imgs.push(...vids.flatMap(v=>v.frames));addMessage('user',text||'📂 Вложения',esc(text||'Вложения: '+files.map(x=>x.name).join(', '))+(imgs.length?'<div class="small">Изображений/кадров: '+imgs.length+'</div>':'')+files.filter(x=>x.type==='audio').map(x=>'<audio controls preload="none" src="'+x.url+'"></audio>').join(''));const pb=progress('Отправляю запрос');const stop=timerProgress(pb);try{const ans=await ask(prompt,imgs);stop();pb.done('Ответ получен');addMessage('ai',ans)}catch(e){stop();pb.done('Ошибка');addMessage('ai','❌ '+e.message,null,false)}}
$('send').onclick=send;input.addEventListener('input',()=>{input.style.height='42px';input.style.height=Math.min(input.scrollHeight,150)+'px'});input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});document.querySelectorAll('[data-prompt]').forEach(b=>b.onclick=()=>{input.value=b.dataset.prompt;input.focus();input.dispatchEvent(new Event('input'))});
$('mic').onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert('Голосовой ввод не поддерживается');return}const r=new SR();r.lang='ru-RU';r.interimResults=false;r.onresult=e=>{input.value=e.results[0][0].transcript;input.focus()};r.onerror=()=>alert('Не удалось распознать речь');r.start()};
$('clear').onclick=()=>{if(confirm('Начать новый чат? История будет очищена.')){history=[];save();chat.innerHTML='<section class="welcome"><div class="welcome-logo">🕷</div><h2>Новый чат</h2><p>Задай вопрос — локальный ИИ ответит.</p></section>'}};
if(history.length){chat.innerHTML='';history.forEach(m=>addMessage(m.r,m.t,null,false))}
if(window.SpiderLocal){$('modelSel').innerHTML='<option>Qwen2.5 0.5B · локально</option>'; $('modelStatus').textContent=window.SpiderLocal.status();}
