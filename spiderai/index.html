<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#b5121b"><link rel="manifest" href="manifest.webmanifest"><title>Spider AI</title>
<style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#170308,#071327);color:#fff;font:16px system-ui,sans-serif;height:100dvh;display:flex;flex-direction:column}.head{padding:18px;text-align:center;background:linear-gradient(90deg,#c51622,#6d0712);box-shadow:0 3px 16px #0008}.head b{font-size:23px}.head small{display:block;opacity:.8}.chat{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}.msg{max-width:88%;padding:12px 15px;border-radius:17px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}.user{align-self:flex-end;background:#b51d2b;border-bottom-right-radius:4px}.ai{align-self:flex-start;background:#ffffff17;border:1px solid #ffffff20;border-bottom-left-radius:4px}.welcome{margin:auto;text-align:center;color:#d9dce8;max-width:400px}.welcome .web{font-size:56px}.composer{display:flex;gap:9px;padding:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom));background:#050912dd;border-top:1px solid #ffffff20}.composer input{min-width:0;flex:1;border:1px solid #a51b29;border-radius:24px;background:#101827;color:white;padding:13px 16px;font:inherit;outline:none}.composer button{border:0;border-radius:24px;background:#c51622;color:white;font-weight:700;padding:0 19px;font-size:20px}.composer button:disabled{opacity:.55}.hint{font-size:11px;color:#9da8bd;text-align:center;padding:0 12px 7px;background:#050912dd}
</style></head><body><header class="head"><b>🕷️ Spider AI</b><small>ИИ-помощник • Интернет требуется</small></header><main class="chat" id="chat"><div class="welcome"><div class="web">🕸️</div><h2>Привет, герой!</h2><p>Задай вопрос — я постараюсь помочь.</p></div></main><form class="composer" id="form"><input id="prompt" autocomplete="off" placeholder="Напиши сообщение…" maxlength="6000"><button id="send" aria-label="Отправить">➤</button></form><div class="hint">Ответы генерируются внешним сервисом; доступность и лимиты зависят от него.</div>
<script>
const chat=document.getElementById('chat'),input=document.getElementById('prompt'),send=document.getElementById('send');let history=[];
function add(role,text){const d=document.createElement('div');d.className='msg '+role;d.textContent=text;chat.append(d);chat.scrollTop=chat.scrollHeight;return d}
document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const q=input.value.trim();if(!q||send.disabled)return;add('user',q);input.value='';send.disabled=true;const wait=add('ai','🕷️ Думаю…');try{const system='Ты — Spider AI, дружелюбный и честный ИИ-помощник. Отвечай на языке пользователя, по делу. Не утверждай, что выполнил действия, если не выполнил.';const prompt=system+'\n\n'+history.slice(-8).map(x=>(x.role==='user'?'Пользователь: ':'Ассистент: ')+x.text).join('\n')+'\nПользователь: '+q+'\nАссистент:';const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),45000);const response=await fetch('https://text.pollinations.ai/'+encodeURIComponent(prompt)+'?model=openai',{signal:controller.signal,headers:{'Accept':'text/plain'}});clearTimeout(timer);if(!response.ok)throw new Error('Сервис ответил HTTP '+response.status);const answer=(await response.text()).trim();if(!answer)throw new Error('Сервис вернул пустой ответ');wait.textContent=answer;history.push({role:'user',text:q},{role:'assistant',text:answer});history=history.slice(-20)}catch(err){wait.textContent=err.name==='AbortError'?'Время ожидания истекло. Попробуй ещё раз.':'Не удалось получить ответ: '+err.message+'. Проверь интернет или доступность API.'}finally{send.disabled=false;input.focus();chat.scrollTop=chat.scrollHeight}});
if('serviceWorker'in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
