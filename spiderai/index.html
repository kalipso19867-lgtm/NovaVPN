<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#e62429"><link rel="manifest" href="manifest.webmanifest"><title>Spider AI</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font:15px system-ui,sans-serif;background:linear-gradient(160deg,#1a0000,#000428 60%,#000011);color:#fff;height:100dvh;display:flex;flex-direction:column;overflow:hidden}header{padding:9px 10px;background:linear-gradient(90deg,#e62429,#9d1118);text-align:center}header h1{margin:0;font-size:19px}header select{width:100%;margin-top:7px;padding:8px;border:0;border-radius:8px;background:#401016;color:white}.chat{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px}.msg{max-width:90%;padding:10px 13px;border-radius:15px;line-height:1.5;overflow-wrap:anywhere;background:#ffffff13;border:1px solid #ffffff20}.user{align-self:flex-end;background:#d92530}.ai{align-self:flex-start}.msg img{max-width:100%;border-radius:9px;display:block;margin-top:7px}.actions{display:flex;gap:5px;margin-top:7px}.actions button,.mode,.btn{border:1px solid #ffffff25;border-radius:9px;background:#ffffff12;color:white;padding:7px 10px}.modes{display:flex;gap:5px;padding:7px 9px;background:#050912dd}.mode{flex:1;font-size:12px}.mode.active{background:#e6242955;border-color:#e62429}.chiprow{padding:3px 10px;min-height:0}.chip{display:inline-flex;gap:8px;align-items:center;padding:6px 10px;border-radius:9px;background:#e6242933;border:1px solid #e62429;font-size:12px}.chip button{background:none;border:0;color:white}.composer{display:flex;gap:7px;padding:9px;background:#050912dd;align-items:center}.composer input{min-width:0;flex:1;padding:12px;border:2px solid #e62429;border-radius:22px;background:#ffffff0c;color:white;font:inherit}.send{background:linear-gradient(135deg,#e62429,#0476f2);font-size:18px}.hint{text-align:center;opacity:.65;font-size:12px;padding:20px}.loader{font-size:28px;text-align:center}.slideshow{position:relative;aspect-ratio:16/9;border-radius:10px;overflow:hidden}.slideshow img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;animation:fade 9s infinite}.slideshow img:nth-child(2){animation-delay:3s}.slideshow img:nth-child(3){animation-delay:6s}@keyframes fade{0%,100%{opacity:0}10%,33%{opacity:1}43%{opacity:0}}#fileInput{position:fixed;left:0;bottom:0;width:1px;height:1px;opacity:.01;z-index:-1}
</style></head><body>
<header><h1>🕷️ Spider AI</h1><select id="modelSel"><option value="openai-fast">openai-fast</option><option value="openai">openai</option><option value="mistral">mistral</option><option value="deepseek">deepseek</option></select></header>
<main id="chat" class="chat"><div class="hint">🕸️ Spider AI — чат, фото, видео и файлы в одной ленте</div></main><div id="chiprow" class="chiprow"></div>
<nav class="modes"><button class="mode active" data-mode="chat">💬 Текст</button><button class="mode" data-mode="img">🖼️ Фото</button><button class="mode" data-mode="vid">🎬 Видео</button><button class="mode" data-mode="file">📎 Файл</button></nav>
<div class="composer"><button class="btn" id="attach">📎</button><button class="btn" id="mic">🎤</button><input id="prompt" placeholder="Напиши сообщение…" autocomplete="off"><button class="btn send" id="send">➤</button></div>
<input id="fileInput" type="file" accept="image/*,video/*,.txt,.md,.json,.js,.ts,.py,.html,.css,.csv,.log,.xml,.yml,.yaml,.java,.sql">
<script>
const $=id=>document.getElementById(id),chat=$('chat'),input=$('prompt'),file=$('fileInput');let mode='chat',attachment=null,history=[];try{history=JSON.parse(localStorage.getItem('sp_h')||'[]')}catch(e){}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function add(role,text,html,save=true){const d=document.createElement('div');d.className='msg '+role;const b=document.createElement('div');b.innerHTML=html||esc(text).replace(/\n/g,'<br>');d.append(b);const a=document.createElement('div');a.className='actions';a.innerHTML='<button>📋 Копировать</button>'+(role==='ai'?'<button>🔊</button>':'')+(b.querySelector('img')?'<button>💾</button>':'');a.children[0].onclick=async()=>{try{await navigator.clipboard.writeText(text)}catch(e){const t=document.createElement('textarea');t.value=text;document.body.append(t);t.select();document.execCommand('copy');t.remove()}a.children[0].textContent='✅ Скопировано'};if(a.children[1]&&role==='ai')a.children[1].onclick=()=>speak(text);if(a.lastElementChild&&b.querySelector('img'))a.lastElementChild.onclick=()=>download(b.querySelector('img').src);d.append(a);chat.append(d);chat.scrollTop=chat.scrollHeight;if(save){history.push({r:role,t:text});history=history.slice(-100);localStorage.setItem('sp_h',JSON.stringify(history))}return d}
function speak(t){if(window.speechSynthesis){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(t))}}
function download(url){const a=document.createElement('a');a.href=url;a.download='spider-image.jpg';a.click()}
const TEXT_MODELS=['openai-fast','openai','mistral','deepseek','qwen','gemini'];
async function ask(text,images=[]){
  const selected=$('modelSel').value;
  const models=[selected,...TEXT_MODELS.filter(m=>m!==selected)];
  if(images.length){
    let last='Vision endpoint unavailable';
    for(const model of models){
      try{
        const content=[{type:'text',text}];
        images.forEach(url=>content.push({type:'image_url',image_url:{url}}));
        const controller=new AbortController(), timer=setTimeout(()=>controller.abort(),55000);
        const response=await fetch('https://text.pollinations.ai/?model='+encodeURIComponent(model),{
          method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({model,messages:[{role:'system',content:'Ты Spider AI. Отвечай по-русски, понятно и по делу.'},{role:'user',content}]}),
          signal:controller.signal
        });
        clearTimeout(timer);
        if(response.ok){const answer=await response.text();if(answer.trim())return answer;}
        last=model+': HTTP '+response.status;
      }catch(e){last=model+': '+e.message;}
    }
    throw Error('Анализ фото/видео не прошёл. '+last+'; попробуй позже.');
  }
  let last='Нет доступных моделей';
  for(const model of models){
    try{
      const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),40000);
      const url='https://text.pollinations.ai/'+encodeURIComponent(text)+'?model='+encodeURIComponent(model)+'&seed='+Math.floor(Math.random()*1000000);
      const response=await fetch(url,{signal:controller.signal});
      clearTimeout(timer);
      if(response.ok){const answer=await response.text();if(answer.trim()&&!answer.trim().startsWith('<'))return answer;}
      last=model+': HTTP '+response.status;
    }catch(e){last=model+': '+e.message;}
  }
  throw Error('Все текстовые модели недоступны ('+last+'). Попробуй позже.');
}
function chip(){const w=$('chiprow');w.innerHTML='';if(!attachment)return;const c=document.createElement('span');c.className='chip';c.textContent=(attachment.type==='video'?'🎬 ':attachment.type==='image'?'📷 ':'📄 ')+attachment.name;const x=document.createElement('button');x.textContent='✖';x.onclick=()=>{attachment=null;file.value='';chip()};c.append(x);w.append(c)}
function imageData(f){return new Promise(resolve=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),s=Math.min(1,1024/Math.max(im.width,im.height));c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.82))};im.onerror=()=>resolve(null);im.src=URL.createObjectURL(f)})}
function framesOf(f,n=3){return new Promise(resolve=>{const v=document.createElement('video'),u=URL.createObjectURL(f);v.preload='auto';v.muted=true;v.playsInline=true;v.onloadedmetadata=async()=>{const c=document.createElement('canvas'),ctx=c.getContext('2d'),w=Math.min(640,v.videoWidth),h=Math.round(v.videoHeight*w/v.videoWidth);c.width=w;c.height=h;const out=[];for(let i=0;i<n;i++){const t=Math.min(Math.max(0,v.duration*(i+.5)/n),Math.max(0,v.duration-.05));await new Promise(ok=>{const done=()=>{v.removeEventListener('seeked',done);try{ctx.drawImage(v,0,0,w,h);out.push(c.toDataURL('image/jpeg',.78))}catch(e){}ok()};v.addEventListener('seeked',done,{once:true});v.currentTime=t;setTimeout(ok,4000)});}URL.revokeObjectURL(u);resolve(out)};v.onerror=()=>{URL.revokeObjectURL(u);resolve([])};v.src=u;v.load()})}
file.onchange=async()=>{const f=file.files&&file.files[0];if(!f)return;const w=$('chiprow');w.textContent='⏳ Обрабатываю '+f.name;if(f.type.startsWith('video/')){const fr=await framesOf(f);attachment=fr.length?{type:'video',frames:fr,name:f.name}:null}else if(f.type.startsWith('image/')){const data=await imageData(f);attachment=data?{type:'image',data,name:f.name}:null}else{try{attachment={type:'text',content:(await f.text()).slice(0,20000),name:f.name}}catch(e){attachment=null}}file.value='';chip();if(!attachment)w.textContent='Не удалось прочитать файл'}
function choose(){file.click()}
document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('.mode').forEach(x=>x.classList.toggle('active',x===b));if(mode==='file'){choose();return}input.placeholder={chat:'Напиши сообщение…',img:'Опиши картинку для генерации…',vid:'Опиши клип или прикрепи своё видео…'}[mode]});
$('attach').onclick=choose;
async function send(){const t=input.value.trim();if(mode==='img'){if(!t)return;input.value='';add('user','🖼️ '+t);const d=add('ai','Рисую…');try{const url='https://image.pollinations.ai/prompt/'+encodeURIComponent(t)+'?width=1024&height=1024&nologo=true';const im=new Image();im.onload=()=>{d.remove();add('ai','🖼️ '+t,'<b>🖼️ '+esc(t)+'</b><img src="'+url+'">',false)};im.onerror=()=>{d.remove();add('ai','Не удалось создать изображение. Попробуй ещё раз.',null,false)};im.src=url}catch(e){d.remove();add('ai',e.message,null,false)}return}
if(mode==='vid'&&!attachment){if(!t)return;input.value='';add('user','🎬 '+t);const d=add('ai','Создаю три кадра…');try{const urls=[1,2,3].map(i=>'https://image.pollinations.ai/prompt/'+encodeURIComponent('Cinematic frame '+i+' of 3, consistent characters and scene: '+t)+'?width=960&height=540&nologo=true&seed='+(Date.now()+i));await Promise.all(urls.map(u=>new Promise((ok,no)=>{const im=new Image();im.onload=ok;im.onerror=no;im.src=u})));d.remove();add('ai','Клип из трёх кадров — это слайд-шоу, не полноценное видео','<div class="slideshow">'+urls.map(u=>'<img src="'+u+'">').join('')+'</div>',false)}catch(e){d.remove();add('ai','Ошибка создания кадров',null,false)}return}
if(!t&&!attachment)return;input.value='';const a=attachment;attachment=null;chip();add('user',t||('📎 '+a.name),esc(t||a.name)+(a&&a.type==='image'?'<img src="'+a.data+'">':''));let q=t||'Проанализируй вложение';let imgs=[];if(a?.type==='image')imgs=[a.data];if(a?.type==='text')q+='\nФайл '+a.name+':\n'+a.content;if(a?.type==='video'){imgs=a.frames;q+='\nПроанализируй кадры видео по порядку.'}const d=add('ai','Думаю…');try{const ans=await ask(q,imgs);d.remove();add('ai',ans)}catch(e){d.remove();add('ai','❌ '+e.message,null,false)}}
$('send').onclick=send;input.onkeydown=e=>{if(e.key==='Enter')send()};$('mic').onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert('Голосовой ввод не поддерживается');return}const r=new SR();r.lang='ru-RU';r.onresult=e=>input.value=e.results[0][0].transcript;r.start()};
$('modelSel').onchange=()=>localStorage.setItem('sp_model',$('modelSel').value);$('modelSel').value=localStorage.getItem('sp_model')||'openai-fast';
if(history.length){chat.innerHTML='';history.forEach(m=>add(m.r,m.t,null,false))}
</script></body></html>
