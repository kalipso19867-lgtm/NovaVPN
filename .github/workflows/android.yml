name: NovaVPN sing-box Android APK
on: [workflow_dispatch, push]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout NovaVPN build recipe
        uses: actions/checkout@v4
      - name: Checkout sing-box Android client
        run: |
          git clone --depth 1 https://github.com/TypeNil/vpnclient-android.git client
          sed -i 's#<string name="brand_name" translatable="false">Yuyake</string>#<string name="brand_name" translatable="false">NovaVPN</string>#' client/app/src/main/res/values/strings.xml
          sed -i 's#<string name="brand_wordmark" translatable="false">YUYAKE</string>#<string name="brand_wordmark" translatable="false">NOVAVPN</string>#' client/app/src/main/res/values/strings.xml
          python3 - <<'PY'
          from pathlib import Path
          p = Path("client/app/build.gradle.kts")
          s = p.read_text()
          s = s.replace("android {", '''android {
              splits {
                  abi {
                      isEnable = true
                      reset()
                      include("arm64-v8a")
                      isUniversalApk = false
                  }
              }''', 1)
          p.write_text(s)
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Build sing-box Android APK
        working-directory: client
        run: |
          gradle --no-daemon assembleArm64Debug
      - uses: actions/upload-artifact@v4
        with:
          name: NovaVPN-singbox-debug-apk
          path: client/app/build/outputs/apk/arm64/debug/*.apk
          if-no-files-found: error
          retention-days: 30
