name: Build MyGPT 160 Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'mygpt/**'
      - 'mygpt-android/**'
      - '.github/workflows/build-mygpt-apk.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Copy web app into Android assets
        run: |
          mkdir -p mygpt-android/app/src/main/assets/www
          cp -R mygpt/. mygpt-android/app/src/main/assets/www/
      - name: Build debug APK
        working-directory: mygpt-android
        run: gradle --no-daemon assembleDebug
      - name: Package installable project sources
        run: |
          zip -r MyGPT-160-Android-source.zip mygpt mygpt-android .github/workflows/build-mygpt-apk.yml
      - uses: actions/upload-artifact@v4
        with:
          name: MyGPT-160-Android
          path: |
            mygpt-android/app/build/outputs/apk/debug/app-debug.apk
            MyGPT-160-Android-source.zip
          retention-days: 30
