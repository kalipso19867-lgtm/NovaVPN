name: Build Spider AI APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'spiderai/**'
      - 'spiderai-android/**'
      - '.github/workflows/build-spiderai-apk.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Copy web app into Android assets
        run: |
          mkdir -p spiderai-android/app/src/main/assets/www
          cp -R spiderai/. spiderai-android/app/src/main/assets/www/
      - name: Build debug APK
        working-directory: spiderai-android
        run: gradle --no-daemon assembleDebug
      - name: Package source ZIP
        run: zip -r SpiderAI-source.zip spiderai spiderai-android .github/workflows/build-spiderai-apk.yml
      - uses: actions/upload-artifact@v4
        with:
          name: SpiderAI-Android
          path: |
            spiderai-android/app/build/outputs/apk/debug/app-debug.apk
            SpiderAI-source.zip
          retention-days: 30
